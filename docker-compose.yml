services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kp_astrology
      POSTGRES_USER: kp_user
      POSTGRES_PASSWORD: kp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kp_user -d kp_astrology"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kp_user:kp_password@database:5432/kp_astrology
      OLLAMA_URL: http://ollama:11434/api/generate
      LM_STUDIO_URL: http://host.docker.internal:1234/v1/chat/completions
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
